name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Offline Verifiers and Parity Tests
        run: |
          python3 main.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend controller regressions
        run: node tests/test_frontend.js
